name: Release

# Cutting a release is pushing a tag:  git tag vX.Y.Z && git push origin vX.Y.Z
# The manual dispatch runs the same build but only leaves a workflow artifact,
# which is a safe way to check the pipeline without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # No SDK set-up step on purpose. The runner images already ship an Android
      # SDK with the licences accepted and ANDROID_HOME exported, and the Android
      # Gradle Plugin downloads whichever platform and build-tools it needs.
      # android-actions/setup-android cannot be used: its default `sdkmanager
      # tools` call fails because the legacy "tools" package no longer exists.

      # The keystore is a binary, so it travels as base64 in a secret. It is
      # decoded into the runner's temp directory, never into the checkout, so it
      # cannot be picked up by the build output or an artifact upload.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK really is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # Naming the asset after the tag keeps several versions from colliding.
      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/android-launcher-${GITHUB_REF_NAME}.apk"
          ls -l dist

      - name: Upload it as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: dist/*.apk

      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
